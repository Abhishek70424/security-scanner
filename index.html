<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Security Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    .invalid {
      background: #ffebee;
      border: 2px solid #ea4335;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>👮 Security Scanner</h1>

    <button class="start-btn"
            onclick="startScanner()">

      📷 START CAMERA

    </button>

    <div id="reader"></div>

    <div id="result"
         class="result">
    </div>

  </div>


<script>

let scanner = null;

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyuuwuKRnKu4RqrJdp3lD0tEMsAsxwaaxuhRSdrG0nC10iLvi06jxnN2-AQ6I6ZVgWw/exec";


function startScanner() {

  document.getElementById("result").style.display = "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      scanner.stop()
        .then(function() {

          verifyPass(decodedText);

        })
        .catch(function() {

          verifyPass(decodedText);

        });

    },

    function(errorMessage) {

      // Ignore continuous scanning errors

    }

  ).catch(function(error) {

    showError(error);

  });

}


function verifyPass(passId) {

  document.getElementById("result").style.display = "block";

  document.getElementById("result").className =
    "result";

  document.getElementById("result").innerHTML =
    "<h2>⏳ Checking Pass...</h2>" +
    "<p>Please wait...</p>";


  // Open Apps Script verification page

  const url =
    APPS_SCRIPT_URL +
    "?verify=" +
    encodeURIComponent(passId);


  setTimeout(function() {

    window.location.href = url;

  }, 500);

}


function showError(error) {

  const result =
    document.getElementById("result");

  result.style.display = "block";

  result.className =
    "result invalid";

  result.innerHTML =
    "<h2>❌ Camera Error</h2>" +
    "<p>Camera start nahi ho pa raha.</p>" +
    "<small>" +
    error +
    "</small>";

}

</script>

</body>

</html>
